name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ── Backend lint (ruff) ────────────────────────────────────────────

  backend-lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: pip install --no-cache-dir poetry==1.8.*

      - name: Install dependencies
        working-directory: backend
        run: poetry install --no-interaction --no-ansi --no-root

      - name: Run ruff
        working-directory: backend
        run: poetry run ruff check .

  # ── Backend tests (pytest + Postgres + Redis) ──────────────────────

  backend-test:
    runs-on: ubuntu-24.04

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: patent_pulse_test
          POSTGRES_USER: patent
          POSTGRES_PASSWORD: secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # TEST_* vars are read by tests/conftest.py to avoid colliding with
      # any production DATABASE_URL set in the dev environment.
      TEST_DATABASE_URL: postgresql+asyncpg://patent:secret@localhost:5432/patent_pulse_test
      TEST_DATABASE_URL_SYNC: postgresql+psycopg2://patent:secret@localhost:5432/patent_pulse_test
      TEST_REDIS_URL: redis://localhost:6379/1
      # DATABASE_URL is still set so alembic upgrade head can run before tests.
      DATABASE_URL: postgresql+asyncpg://patent:secret@localhost:5432/patent_pulse_test
      DATABASE_URL_SYNC: postgresql+psycopg2://patent:secret@localhost:5432/patent_pulse_test
      REDIS_URL: redis://localhost:6379/1
      ANTHROPIC_API_KEY: test-key
      OPENAI_API_KEY: test-key
      USPTO_API_KEY: test-key
      AUTH_SECRET_KEY: ci-test-secret-32-bytes-minimum-len
      RESEND_API_KEY: re_test
      EMAIL_FROM_ADDRESS: test@example.com
      EMAIL_DEV_RECIPIENT: dev@example.com
      EMAIL_SEND_MODE: dev
      ENVIRONMENT: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: pip install --no-cache-dir poetry==1.8.*

      - uses: actions/cache@v4
        with:
          path: ~/.cache/pypoetry
          key: poetry-${{ runner.os }}-${{ hashFiles('backend/poetry.lock') }}
          restore-keys: |
            poetry-${{ runner.os }}-

      - name: Install dependencies
        working-directory: backend
        run: poetry install --no-interaction --no-ansi --no-root

      - name: Wait for Postgres
        run: |
          for i in $(seq 1 15); do
            pg_isready -h localhost -U patent -d patent_pulse_test && break
            echo "Waiting for Postgres... ($i/15)"
            sleep 2
          done

      - name: Run migrations
        working-directory: backend
        run: poetry run alembic upgrade head

      - name: Run tests
        working-directory: backend
        run: poetry run pytest -q

  # ── Frontend build (Next.js) ───────────────────────────────────────

  frontend-build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        run: npm run build
