name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ── Backend lint (ruff) ────────────────────────────────────────────
  # NOTE: continue-on-error temporarily allowed (2026-06-04) due to ~50 lint
  # errors in pre-existing test files (inline imports, F401 unused). Tracked
  # as lint debt — clean up in a focused PR. CI deploy is not gated on lint
  # passing while this debt exists.

  backend-lint:
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: pip install --no-cache-dir poetry==1.8.*

      - name: Install dependencies
        working-directory: backend
        run: poetry install --no-interaction --no-ansi --no-root

      - name: Run ruff
        working-directory: backend
        run: poetry run ruff check .

  # ── Backend tests (pytest + Postgres + Redis) ──────────────────────

  backend-test:
    runs-on: ubuntu-24.04

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: patent_pulse_test
          POSTGRES_USER: patent
          POSTGRES_PASSWORD: secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # Test DB connection URLs (used by app/conftest)
      TEST_DATABASE_URL: postgresql+asyncpg://patent:secret@localhost:5432/patent_pulse_test
      TEST_DATABASE_URL_SYNC: postgresql+psycopg2://patent:secret@localhost:5432/patent_pulse_test
      # alembic env.py reads DATABASE_URL_SYNC; alias it to the test DB so
      # migrations run against patent_pulse_test (not the default patent_pulse).
      DATABASE_URL_SYNC: postgresql+psycopg2://patent:secret@localhost:5432/patent_pulse_test
      DATABASE_URL: postgresql+asyncpg://patent:secret@localhost:5432/patent_pulse_test
      REDIS_URL: redis://localhost:6379/0
      EMAIL_DEV_RECIPIENT: dev@example.com
      EMAIL_SEND_MODE: dev
      ENVIRONMENT: test
      # App imports may require these to be set even if empty
      ANTHROPIC_API_KEY: ""
      OPENAI_API_KEY: ""
      AUTH_SECRET_KEY: "test-secret-key-not-real"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: pip install --no-cache-dir poetry==1.8.*

      - uses: actions/cache@v4
        with:
          path: ~/.cache/pypoetry
          key: poetry-${{ runner.os }}-${{ hashFiles('backend/poetry.lock') }}
          restore-keys: |
            poetry-${{ runner.os }}-

      - name: Install dependencies
        working-directory: backend
        run: poetry install --no-interaction --no-ansi --no-root

      - name: Wait for Postgres
        run: |
          for i in $(seq 1 15); do
            pg_isready -h localhost -U patent -d patent_pulse_test && break
            echo "Waiting for Postgres... ($i/15)"
            sleep 2
          done

      - name: Run migrations
        working-directory: backend
        run: poetry run alembic upgrade head

      - name: Run tests
        working-directory: backend
        run: poetry run pytest -q

  # ── Frontend build (Next.js) ───────────────────────────────────────

  frontend-build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        run: npm run build

  # ── Deploy to Hetzner (only on push to main, after all checks pass) ─

  deploy:
    needs: [backend-lint, backend-test, frontend-build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Hetzner
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: root
          key: ${{ secrets.DEPLOY_KEY }}
          script_stop: true
          script: |
            set -e
            cd /opt/invention-index-8

            # Record current commit for rollback
            PREV_COMMIT=$(git rev-parse HEAD)
            echo "Previous commit: $PREV_COMMIT"

            # Pull latest
            git pull origin main

            # Run migrations
            docker compose exec -T backend alembic upgrade head

            # Rebuild and restart
            docker compose up -d --build --force-recreate backend worker beat frontend

            # Health check — poll for up to 90 seconds
            for i in $(seq 1 30); do
              STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/health)
              if [ "$STATUS" = "200" ]; then
                echo "Health check passed after $((i * 3))s"
                exit 0
              fi
              echo "Health check attempt $i/30: got $STATUS, waiting..."
              sleep 3
            done

            # Rollback on failure
            echo "Health check failed after 90s — rolling back to $PREV_COMMIT"
            git checkout "$PREV_COMMIT"
            docker compose up -d --build --force-recreate backend worker beat frontend
            exit 1

      - name: Notify success
        if: success()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.resend.com
          server_port: 465
          username: resend
          password: ${{ secrets.RESEND_API_KEY }}
          from: deploy@inventionindex8.com
          to: andy@web3r.tech
          subject: "✅ Deploy succeeded — Invention Index 8"
          body: |
            Deploy of ${{ github.sha }} to inventionindex8.com succeeded.
            Commit: ${{ github.event.head_commit.message }}
            ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}

      - name: Notify failure
        if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.resend.com
          server_port: 465
          username: resend
          password: ${{ secrets.RESEND_API_KEY }}
          from: deploy@inventionindex8.com
          to: andy@web3r.tech
          subject: "❌ Deploy FAILED — Invention Index 8"
          body: |
            Deploy of ${{ github.sha }} FAILED and was rolled back.
            Commit: ${{ github.event.head_commit.message }}
            Check logs: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
