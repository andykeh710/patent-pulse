services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: patent_pulse
      POSTGRES_USER: patent
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secret}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "patent", "-d", "patent_pulse"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    dns:
      - 8.8.8.8
      - 1.1.1.1
    volumes:
      - ./backend:/app
      # GCP service account JSON, read-only inside container.
      # Set GOOGLE_APPLICATION_CREDENTIALS_HOST in .env to the host path
      # of the JSON file (e.g. /Users/you/Downloads/patent-signals-XXX.json).
      - ${GOOGLE_APPLICATION_CREDENTIALS_HOST:-/dev/null}:/run/secrets/gcp-sa.json:ro
    ports:
      - "8080:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://patent:${POSTGRES_PASSWORD:-secret}@db:5432/patent_pulse
      DATABASE_URL_SYNC: postgresql+psycopg2://patent:${POSTGRES_PASSWORD:-secret}@db:5432/patent_pulse
      REDIS_URL: redis://redis:6379/0
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      AUTH_SECRET_KEY: ${AUTH_SECRET_KEY}
      RESEND_API_KEY: ${RESEND_API_KEY}
      EMAIL_FROM_ADDRESS: ${EMAIL_FROM_ADDRESS}
      EMAIL_DEV_RECIPIENT: ${EMAIL_DEV_RECIPIENT}
      EMAIL_SEND_MODE: ${EMAIL_SEND_MODE:-dev}
      EMAIL_PRODUCTION_ACKNOWLEDGED: ${EMAIL_PRODUCTION_ACKNOWLEDGED:-}
      MAGIC_LINK_BASE_URL: ${MAGIC_LINK_BASE_URL:-http://localhost:3000}
      USPTO_API_KEY: ${USPTO_API_KEY}
      GOOGLE_CLOUD_PROJECT: ${GOOGLE_CLOUD_PROJECT:-}
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/gcp-sa.json
      CLAUDE_MODEL: ${CLAUDE_MODEL:-claude-sonnet-4-20250514}
      SUMMARIZATION_BATCH_SIZE: ${SUMMARIZATION_BATCH_SIZE:-10}
      MAX_SUMMARY_RETRIES: ${MAX_SUMMARY_RETRIES:-3}
      INGEST_LOOKBACK_DAYS: ${INGEST_LOOKBACK_DAYS:-7}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      EPO_OPS_CLIENT_ID: ${EPO_OPS_CLIENT_ID:-}
      EPO_OPS_CLIENT_SECRET: ${EPO_OPS_CLIENT_SECRET:-}
      ENVIRONMENT: ${ENVIRONMENT:-development}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: celery -A app.tasks.celery_app worker --loglevel=info -Q ingestion,summarization,maintenance
    dns:
      - 8.8.8.8
      - 1.1.1.1
    volumes:
      - ./backend:/app
      - ${GOOGLE_APPLICATION_CREDENTIALS_HOST:-/dev/null}:/run/secrets/gcp-sa.json:ro
    environment:
      DATABASE_URL: postgresql+asyncpg://patent:${POSTGRES_PASSWORD:-secret}@db:5432/patent_pulse
      DATABASE_URL_SYNC: postgresql+psycopg2://patent:${POSTGRES_PASSWORD:-secret}@db:5432/patent_pulse
      REDIS_URL: redis://redis:6379/0
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      AUTH_SECRET_KEY: ${AUTH_SECRET_KEY}
      RESEND_API_KEY: ${RESEND_API_KEY}
      EMAIL_FROM_ADDRESS: ${EMAIL_FROM_ADDRESS}
      EMAIL_DEV_RECIPIENT: ${EMAIL_DEV_RECIPIENT}
      EMAIL_SEND_MODE: ${EMAIL_SEND_MODE:-dev}
      EMAIL_PRODUCTION_ACKNOWLEDGED: ${EMAIL_PRODUCTION_ACKNOWLEDGED:-}
      MAGIC_LINK_BASE_URL: ${MAGIC_LINK_BASE_URL:-http://localhost:3000}
      USPTO_API_KEY: ${USPTO_API_KEY}
      GOOGLE_CLOUD_PROJECT: ${GOOGLE_CLOUD_PROJECT:-}
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/gcp-sa.json
      CLAUDE_MODEL: ${CLAUDE_MODEL:-claude-sonnet-4-20250514}
      SUMMARIZATION_BATCH_SIZE: ${SUMMARIZATION_BATCH_SIZE:-10}
      MAX_SUMMARY_RETRIES: ${MAX_SUMMARY_RETRIES:-3}
      INGEST_LOOKBACK_DAYS: ${INGEST_LOOKBACK_DAYS:-7}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      EPO_OPS_CLIENT_ID: ${EPO_OPS_CLIENT_ID:-}
      EPO_OPS_CLIENT_SECRET: ${EPO_OPS_CLIENT_SECRET:-}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      CELERY_WORKER: "true"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: celery -A app.tasks.celery_app beat --loglevel=info --schedule=/var/celery/beat-schedule
    volumes:
      - ./backend:/app
      - celerybeat:/var/celery
    environment:
      DATABASE_URL: postgresql+asyncpg://patent:${POSTGRES_PASSWORD:-secret}@db:5432/patent_pulse
      DATABASE_URL_SYNC: postgresql+psycopg2://patent:${POSTGRES_PASSWORD:-secret}@db:5432/patent_pulse
      REDIS_URL: redis://redis:6379/0
      ENVIRONMENT: ${ENVIRONMENT:-development}
      CELERY_WORKER: "true"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://backend:8000
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://backend:8000
      NODE_ENV: production
    depends_on:
      - backend

volumes:
  pgdata:
  celerybeat:
