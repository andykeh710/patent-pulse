[tool.poetry]
name = "patent-pulse"
version = "0.1.0"
description = "Patent intelligence and summarization system"
authors = ["Patent Pulse Team"]
readme = "README.md"

[tool.poetry.dependencies]
python = ">=3.12,<3.13"
fastapi = "^0.115"
uvicorn = {extras = ["standard"], version = "^0.32"}
sqlalchemy = {extras = ["asyncio"], version = "^2.0"}
asyncpg = "^0.30"
psycopg2-binary = "^2.9"
alembic = "^1.14"
pgvector = "^0.3"
celery = {extras = ["redis"], version = "^5.4"}
pydantic = "^2.10"
pydantic-settings = "^2.6"
anthropic = "^0.40"
httpx = "^0.27"
patent-client = "^5.0"
pyjwt = "^2.9"
resend = "^2.6"
jinja2 = "^3.1"
stripe = "^11.0"
google-cloud-bigquery = "^3.25"
structlog = "^24.4"
slowapi = "^0.1.9"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3"
pytest-asyncio = "^0.24"
pytest-cov = "^6.0"
httpx = ">=0.27,<0.28"
factory-boy = "^3.3"
ruff = "^0.8"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]
